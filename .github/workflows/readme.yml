name: Update README with star lists

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '23 23 * * 1,4,6' # 23:23 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  update_readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Generate README
        run: uv run build.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update starred lists"
          git push
